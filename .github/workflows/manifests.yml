name: manifests

# Keeps the Claude Code, Cursor, Codex/ChatGPT and Gemini CLI manifests in
# step (name, version, server URL, files they name).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-manifests.mjs
