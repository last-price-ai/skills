name: manifests

# Keeps the Claude Code, Cursor, Codex/ChatGPT and Gemini CLI manifests in
# step (name, version, server URL, files they name).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Scripts and package.json live on the tooling branch: the plugin
      # directory does not allow them inside the plugin (the repository root).
      - uses: actions/checkout@v4
        with:
          ref: tooling
          path: tooling
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tooling/scripts/check-manifests.mjs
