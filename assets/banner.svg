<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Last Price: Price computation as a service">
  <title>Last Price: Price computation as a service</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06120d"/>
      <stop offset="1" stop-color="#0b1f17"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#10b981" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)"/>
  <rect width="1280" height="320" fill="url(#glow)"/>

  <!-- Wordmark -->
  <g transform="translate(72 108)">
    <rect width="104" height="104" rx="22" fill="url(#tile)"/>
    <text x="52" y="54" text-anchor="middle" dominant-baseline="central" class="mono" font-weight="700" font-size="54" fill="#04140d" letter-spacing="-2">L$</text>
  </g>
  <text x="204" y="160" class="sans" font-weight="700" font-size="60" fill="#f2fbf7">Last Price</text>
  <text x="206" y="204" class="sans" font-size="26" fill="#a7d9c3">Price computation as a service</text>

  <!-- Inputs flowing into the engine -->
  <g class="mono" font-size="15" fill="#cfeee1">
    <g transform="translate(700 70)">
      <rect width="132" height="40" rx="10" fill="#0f2a20" stroke="#1f5a43"/>
      <text x="16" y="25">cost $18</text>
    </g>
    <g transform="translate(700 140)">
      <rect width="132" height="40" rx="10" fill="#0f2a20" stroke="#1f5a43"/>
      <text x="16" y="25">demand ↑</text>
    </g>
    <g transform="translate(700 210)">
      <rect width="132" height="40" rx="10" fill="#0f2a20" stroke="#1f5a43"/>
      <text x="16" y="25">market $44</text>
    </g>
  </g>

  <g fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.7">
    <path d="M832 90 C890 90 900 160 952 160" stroke-dasharray="4 6"/>
    <path d="M832 160 H952" stroke-dasharray="4 6"/>
    <path d="M832 230 C890 230 900 160 952 160" stroke-dasharray="4 6"/>
    <path d="M1032 160 H1078"/>
  </g>
  <g fill="#10b981">
    <circle cx="870" cy="104" r="4"/>
    <circle cx="892" cy="160" r="4"/>
    <circle cx="870" cy="216" r="4"/>
  </g>

  <!-- Engine node -->
  <g transform="translate(952 120)">
    <rect width="80" height="80" rx="18" fill="#0f2a20" stroke="#10b981" stroke-width="2"/>
    <text x="40" y="47" text-anchor="middle" class="mono" font-size="22" font-weight="700" fill="#10b981">ƒ(x)</text>
  </g>

  <!-- Price tag output -->
  <g transform="translate(1078 124)">
    <path d="M0 18 L18 0 H122 a10 10 0 0 1 10 10 V62 a10 10 0 0 1 -10 10 H18 L0 54 Z" fill="url(#tile)"/>
    <circle cx="18" cy="36" r="5" fill="#06120d"/>
    <text x="74" y="45" text-anchor="middle" class="mono" font-weight="700" font-size="24" fill="#04140d">$39</text>
  </g>
</svg>
